name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'

      - name: gofmt
        run: |
          out=$(gofmt -l . tools/zfsjudge)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: Build and vet (library and judge tool)
        run: |
          CGO_ENABLED=0 go build ./...
          go vet ./...
          cd tools/zfsjudge && GOOS=linux go vet ./...

      # The OpenZFS fixtures are committed; ZFSCRYPT_FIXTURES would point the
      # same tests at a freshly generated file.
      - name: Test (race, coverage)
        run: go test -race -covermode=atomic -coverprofile=cover.out ./...

      # Uncovered BLOCKS, not `go tool cover -func`'s total, which rounds to
      # 0.1% and passes at 99.95%; an empty profile fails.
      - name: Coverage is 100%
        run: go run github.com/go-fleettools/fleettools/cmd/covblocks@v0.124.0 cover.out

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go test -run '^$' -fuzz '^FuzzInputs$' -fuzztime 60s -fuzzminimizetime 5s .

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Big-endian and non-x86 targets: the key hierarchy, the OpenZFS fixtures
  # (little-endian on disk) and the AEADs must give the same bytes everywhere.
  emulated:
    name: emulated ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            qemu_cpu: "rv64,v=true,vlen=128"
          - arch: loong64
            image: ghcr.io/loong64/debian:trixie
            qemu_cpu: "la464"
          - arch: ppc64le
            image: debian:trixie
            qemu_cpu: "power9"
          - arch: s390x
            image: debian:trixie
            qemu_cpu: "qemu"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'

      - name: Register binfmt handlers
        run: docker run --rm --privileged tonistiigi/binfmt --install all

      - name: Cross-compile the test binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go test -c -o zfscrypt.test .

      # The fixtures are read from testdata/, relative to the working dir.
      - name: Run under QEMU
        run: |
          docker run --rm \
            --platform linux/${{ matrix.arch }} \
            -e QEMU_CPU='${{ matrix.qemu_cpu }}' \
            -v "$PWD:/work" -w /work \
            ${{ matrix.image }} \
            ./zfscrypt.test -test.v -test.timeout 30m
